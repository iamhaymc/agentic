<!DOCTYPE html>
<html lang="en" data-theme-type="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Agentic</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/ui.css" />
</head>

<body>
  <div class="app" id="app" data-state="connecting" data-view="discussion">
    <header class="bar">
      <!-- The mark is the only status light: its ring, its core and its
             motion all change with the connection and with a live run. -->
      <span class="brand" id="brand" role="img" aria-label="agentic, connecting" title="agentic — connecting">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <!-- The core fills like a vial with the context in use (`--fill`). -->
          <clipPath id="mark-level">
            <rect class="mark-level" x="0" y="6.4" width="24" height="24" />
          </clipPath>
          <circle class="mark-halo" cx="12" cy="12" r="10.5" />
          <circle class="mark-ring" cx="12" cy="12" r="7.75" />
          <path class="mark-shell" d="M12 6.4 15.1 12 12 17.6 8.9 12Z" />
          <path class="mark-core" d="M12 6.4 15.1 12 12 17.6 8.9 12Z" clip-path="url(#mark-level)" />
        </svg>
      </span>
      <!-- How long a silent model has been writing; shown only while it is. -->
      <span class="wait" id="wait" hidden></span>
      <span class="sr-only" id="status-text" role="status">connecting</span>
      <span class="session" id="session" title="Active session"></span>
      <!-- The context in use, as a hairline under the bar. -->
      <span class="gauge" id="gauge" aria-hidden="true" hidden></span>
    </header>
    <main class="discussion" id="discussion" aria-live="polite">
      <div class="empty" id="empty">
        <p>Ask anything. Type <code>/help</code> for commands.</p>
      </div>
    </main>
    <!-- The composer lifted into a full markdown editor. It shares the grid row
           of the discussion and covers it, so the discussion keeps its scroll. -->
    <section class="editor" id="editor" aria-label="Markdown editor">
      <div class="editor-head">
        <button class="button tiny" id="editor-copy" type="button" title="Copy" aria-label="Copy to clipboard">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2" />
          </svg>
        </button>
        <button class="tab drop" id="drop" type="button" title="Back to discussion" aria-label="Back to discussion">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
      </div>
      <!-- The textarea is the input, its text transparent; the layer under it
             paints the same characters highlighted. -->
      <div class="editor-surface">
        <pre class="editor-paint" aria-hidden="true"><code id="editor-paint"></code></pre>
        <textarea id="editor-text" class="editor-text" placeholder="Message the agent…" spellcheck="false"
          aria-label="Markdown"></textarea>
      </div>
    </section>
    <footer class="composer">
      <button class="tab lift" id="lift" type="button" title="Markdown editor" aria-label="Open the markdown editor">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m18 15-6-6-6 6" />
        </svg>
      </button>
      <div class="attachments" id="attachments" hidden></div>
      <div class="hints" id="hints" hidden></div>
      <form class="input-row" id="form" autocomplete="off">
        <label class="button quiet" for="file" title="Attach files" aria-label="Attach files">
          <input type="file" id="file" multiple hidden />
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" />
          </svg>
        </label>
        <textarea id="input" class="input" rows="1" placeholder="Message the agent…" disabled></textarea>
        <button class="button quiet" id="send" type="submit" title="Send" aria-label="Send" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 19V5" />
            <path d="m5 12 7-7 7 7" />
          </svg>
        </button>
        <button class="button danger" id="stop" type="button" title="Stop" aria-label="Stop" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </form>
    </footer>
  </div>
  <script src="/ui.js"></script>
</body>

</html>
