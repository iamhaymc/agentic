[project]
name = "agentic"
version = "0.1.0"
description = "Yet another agent harness"
requires-python = ">=3.12"
dependencies = [
    "jinja2",
    "python-dotenv",
    "omegaconf",
    "websockets",
    "openai",
    "openai-agents",
    "cachetools",
    "a2a-sdk[http-server]==1.2.2",
    "uvicorn>=0.35,<1",
    "tiktoken",
    "transformers @ git+https://github.com/huggingface/transformers",
    "accelerate",
    "lighteval",
    "pillow",
    "ipykernel"
]

[project.optional-dependencies]
e2e = ["playwright", "cryptography>=43"]

[project.scripts]
agentic = "agentic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = ["app/agentic.py", "app/agentic_a2a.py", "app/agentic_sandbox.py", "app/agentic_ui.html", "app/agentic_ui.css", "app/agentic_ui.js"]
sources = ["app"]
